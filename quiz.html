<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSHN 689: Nutritional Epidemiology Self-Check Quiz</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --wrong: #dc2626;
      --wrong-bg: #fef2f2;
      --border: #cbd5e1;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem;
    }
    header { text-align: center; margin-bottom: 1.5rem; }
    .course-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
    h1 { font-size: 1.85rem; color: var(--text); margin-top: 0.25rem; }
    .quiz-card {
      background: var(--card-bg);
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
    }
    .progress-bar { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.75rem; }
    .question-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.25rem; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 0.9rem 1.1rem;
      font-size: 1.05rem;
      color: var(--text);
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background-color: #f1f5f9; }
    .option-btn .key-badge {
      font-size: 0.85rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }
    .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #14532d; font-weight: 600; }
    .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #7f1d1d; }
    .feedback-box { margin-top: 1.5rem; padding: 1.1rem; border-radius: var(--radius); display: none; }
    .feedback-box.show { display: block; }
    .feedback-box.correct-fb { background: var(--correct-bg); border: 1px solid var(--correct); color: #14532d; }
    .feedback-box.wrong-fb { background: var(--wrong-bg); border: 1px solid var(--wrong); color: #7f1d1d; }
    .fb-status { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .fb-explanation { font-size: 1rem; }
    .action-btn {
      margin-top: 1.5rem;
      padding: 0.85rem 1.75rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      width: 100%;
      display: none;
    }
    .action-btn:hover { background-color: var(--primary-hover); }
    .action-btn.show { display: block; }
    .results-box { text-align: center; padding: 1rem 0; display: none; }
    .results-box.show { display: block; }
    .score-display { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 1rem 0; }
    footer { text-align: center; font-size: 0.95rem; color: var(--text-muted); margin-top: 2rem; }
  </style>
</head>
<body>

  <header>
    <div class="course-title">FSHN 689</div>
    <h1>Nutritional Epidemiology</h1>
  </header>

  <main class="quiz-card">
    <div id="quiz-container">
      <div class="progress-bar" id="progress-text">Question 1 of 10</div>
      <div class="question-text" id="question-text">Loading question...</div>
      <div class="options-grid" id="options-container"></div>
      <div class="feedback-box" id="feedback-box">
        <div class="fb-status" id="fb-status"></div>
        <div class="fb-explanation" id="fb-explanation"></div>
      </div>
      <button class="action-btn" id="next-btn" onclick="handleNext()">Next [Enter]</button>
    </div>

    <div class="results-box" id="results-container">
      <h2>Self-Check Complete!</h2>
      <div class="score-display" id="score-text">0 / 10</div>
      <button class="action-btn show" onclick="restartQuiz()">Try again</button>
    </div>
  </main>

  <footer>Made by Dr. Esquivel with Gemini</footer>

  <script>
    // Questions array at the top for easy editing
    const questions = [
      {
        question: "Which study design measures exposure and outcome simultaneously in a population at a single point in time?",
        options: ["Cross-sectional study", "Prospective cohort study", "Randomized controlled trial", "Case-control study"],
        answer: 0,
        explanation: "Cross-sectional studies collect exposure and outcome data simultaneously at a single point in time."
      },
      {
        question: "Which study design in nutritional epidemiology is most susceptible to recall bias regarding past diet?",
        options: ["Prospective cohort study", "Case-control study", "Randomized trial", "Ecological study"],
        answer: 1,
        explanation: "Case-control studies rely on retrospective self-reporting of past diet, making them prone to recall bias."
      },
      {
        question: "What term describes a systematic error in study design or execution that produces an incorrect effect estimate?",
        options: ["Confounding", "Random error", "Bias", "Effect modification"],
        answer: 2,
        explanation: "Bias is a systematic error in design, conduct, or analysis that distorts the true association between exposure and outcome."
      },
      {
        question: "Which dietary assessment tool asks participants to report frequency and portion sizes of listed foods over a specified period?",
        options: ["Food Frequency Questionnaire (FFQ)", "24-hour dietary recall", "Weighed food record", "Doubly labeled water technique"],
        answer: 0,
        explanation: "Food Frequency Questionnaires assess habitual long-term dietary intake by asking about frequency and portion sizes of listed foods."
      },
      {
        question: "A variable that is associated with both the dietary exposure and outcome, but not on the causal pathway, is a:",
        options: ["Mediator", "Confounder", "Effect modifier", "Selection bias"],
        answer: 1,
        explanation: "A confounder is independently associated with both exposure and outcome without being an intermediate step on the causal path."
      },
      {
        question: "What is a primary advantage of prospective cohort studies in nutritional epidemiology?",
        options: ["They are inexpensive and fast", "Dietary exposure is measured before disease onset", "They directly prove cause and effect", "They require very small sample sizes"],
        answer: 1,
        explanation: "Prospective cohort studies assess dietary exposure prior to outcome development, establishing temporality and reducing recall bias."
      },
      {
        question: "Which method is considered an objective biomarker for assessing total daily energy expenditure?",
        options: ["Urinary nitrogen", "Doubly labeled water", "Serum carotenoids", "Red blood cell fatty acids"],
        answer: 1,
        explanation: "The doubly labeled water technique provides an accurate, objective biomarker for total daily energy expenditure in free-living individuals."
      },
      {
        question: "Measurement error that affects all individuals in a study population equally and shifts the group mean is called:",
        options: ["Random error", "Systematic error", "Differential misclassification", "Sampling error"],
        answer: 1,
        explanation: "Systematic error consistently skews measurements in one direction, altering the overall group mean estimation."
      },
      {
        question: "In nutritional epidemiology, total energy intake adjustment is primarily performed to:",
        options: ["Increase overall sample size", "Control for confounding and variation by total energy intake", "Eliminate the need for dietary recalls", "Convert qualitative data to quantitative data"],
        answer: 1,
        explanation: "Energy adjustment controls for variations in body size, physical activity, and metabolic efficiency while isolating specific nutrient effects."
      },
      {
        question: "Which study design correlates population-level food consumption rates with population-level disease rates?",
        options: ["Ecological study", "Clinical trial", "Prospective cohort study", "Case-control study"],
        answer: 0,
        explanation: "Ecological studies analyze associations between exposure and outcome data aggregated at the population or group level."
      }
    ];

    let quizState = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initQuiz() {
      quizState = shuffleArray(questions);
      currentIndex = 0;
      score = 0;
      answered = false;
      document.getElementById('quiz-container').style.display = 'block';
      document.getElementById('results-container').classList.remove('show');
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = quizState[currentIndex];
      document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${quizState.length}`;
      document.getElementById('question-text').textContent = q.question;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="key-badge">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      const fbBox = document.getElementById('feedback-box');
      fbBox.className = 'feedback-box';
      document.getElementById('next-btn').classList.remove('show');
    }

    function selectAnswer(idx) {
      if (answered) return;
      answered = true;

      const q = quizState[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);

      const fbBox = document.getElementById('feedback-box');
      const fbStatus = document.getElementById('fb-status');
      const fbExp = document.getElementById('fb-explanation');

      if (idx === q.answer) {
        score++;
        buttons[idx].classList.add('correct');
        fbBox.className = 'feedback-box show correct-fb';
        fbStatus.textContent = 'Correct!';
      } else {
        buttons[idx].classList.add('wrong');
        buttons[q.answer].classList.add('correct');
        fbBox.className = 'feedback-box show wrong-fb';
        fbStatus.textContent = 'Incorrect';
      }

      fbExp.textContent = q.explanation;
      document.getElementById('next-btn').classList.add('show');
    }

    function handleNext() {
      if (!answered) return;
      currentIndex++;
      if (currentIndex < quizState.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-container').style.display = 'none';
      const resContainer = document.getElementById('results-container');
      resContainer.classList.add('show');
      document.getElementById('score-text').textContent = `${score} / ${quizState.length}`;
    }

    function restartQuiz() {
      initQuiz();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '4') {
        const idx = parseInt(e.key) - 1;
        if (document.getElementById('quiz-container').style.display !== 'none' && !answered) {
          selectAnswer(idx);
        }
      } else if (e.key === 'Enter') {
        if (document.getElementById('results-container').classList.contains('show')) {
          restartQuiz();
        } else if (answered) {
          handleNext();
        }
      }
    });

    // Start quiz on load
    initQuiz();
  </script>
</body>
</html>
